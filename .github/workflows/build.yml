name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Create project
        run: |
          set -e
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable-nodpi
          mkdir -p app
          cat > app/build.gradle <<'ZEOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.zaeem.ja'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.zaeem.ja'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.debug
                  }
              }
              lint { checkReleaseBuilds false; abortOnError false }
          }
          ZEOF
          mkdir -p app
          cat > app/proguard-rules.pro <<'ZEOF'
          # no extra rules
          ZEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ZEOF
          mkdir -p app/src/main/java/com/zaeem/ja
          cat > app/src/main/java/com/zaeem/ja/Data.java <<'ZEOF'
          package com.zaeem.ja;

          final class Data {
              static final String[][] ITEMS = {
                  { // الأذكار
                      "سبحان الله وبحمده، سبحان الله العظيم.",
                      "لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير.",
                      "أستغفر الله العظيم الذي لا إله إلا هو الحي القيوم وأتوب إليه.",
                      "لا حول ولا قوة إلا بالله.",
                      "اللهم صلِّ وسلِّم على نبينا محمد.",
                      "حسبيَ الله لا إله إلا هو، عليه توكلت وهو رب العرش العظيم.",
                      "بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم.",
                      "سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر.",
                      "اللهم أعني على ذكرك وشكرك وحسن عبادتك.",
                      "رضيت بالله ربًّا، وبالإسلام دينًا، وبمحمد ﷺ نبيًّا.",
                      "اللهم إني أسألك علمًا نافعًا، ورزقًا طيبًا، وعملًا متقبلًا.",
                      "يا حيُّ يا قيوم برحمتك أستغيث، أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين."
                  },
                  { // الأدعية
                      "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.",
                      "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي.",
                      "رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا.",
                      "رَبِّ زِدْنِي عِلْمًا.",
                      "لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ.",
                      "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا.",
                      "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ.",
                      "اللهم إني أعوذ بك من الهم والحزن، والعجز والكسل، والبخل والجبن، وضلع الدين وغلبة الرجال.",
                      "اللهم يا مقلب القلوب ثبّت قلبي على دينك.",
                      "اللهم اغفر لي ذنبي كله، دقَّه وجلَّه، أوله وآخره، علانيته وسره.",
                      "رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِلَّذِينَ آمَنُوا."
                  },
                  { // الحكم
                      "مَن جدَّ وجد، ومَن زرع حصد.",
                      "قال النبي ﷺ: «الكلمة الطيبة صدقة».",
                      "قال النبي ﷺ: «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه».",
                      "قال النبي ﷺ: «تبسمك في وجه أخيك صدقة».",
                      "قال النبي ﷺ: «خيركم من تعلم القرآن وعلمه».",
                      "قال النبي ﷺ: «الدال على الخير كفاعله».",
                      "قال النبي ﷺ: «من لا يرحم لا يُرحم».",
                      "قال النبي ﷺ: «إنما الأعمال بالنيات».",
                      "قال تعالى: ﴿فَاذْكُرُونِي أَذْكُرْكُمْ﴾.",
                      "قال تعالى: ﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾.",
                      "قال تعالى: ﴿وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ﴾.",
                      "قال علي بن أبي طالب رضي الله عنه: «قيمة كل امرئ ما يحسنه»."
                  },
                  { // الخواطر
                      "إذا ضاقت بك الدنيا فتذكّر أن لك ربًّا بيده مفاتيح الفرج.",
                      "الرضا بقضاء الله راحةٌ لا يعرفها إلا من ذاق طعمها.",
                      "ما تأخّر عنك شيءٌ إلا لأن الله يُعدّ لك ما هو أجمل منه.",
                      "اجعل لسانك رطبًا بذكر الله، يُنوَّر قلبك وتطمئن نفسك.",
                      "الدعاء بابٌ لا يُغلق، فاطرقه في كل وقت ولا تملّ.",
                      "لا تحزن على ما فات، فربما كان في فواته نجاتك.",
                      "صلاة الفجر نورٌ يضيء يومك كله.",
                      "أحسن الظن بالله، فهو عند حسن ظن عبده به.",
                      "القلب الذي يعمره الإيمان لا تهزّه العواصف.",
                      "ابتسم، فالله كتب لك رزقك ولن يسبقك إليه أحد.",
                      "كل ليلة تمرّ هي فرصة جديدة للاستغفار والعودة.",
                      "من أصلح ما بينه وبين الله أصلح الله ما بينه وبين الناس."
                  }
              };
          }
          ZEOF
          mkdir -p app/src/main/java/com/zaeem/ja
          cat > app/src/main/java/com/zaeem/ja/MainActivity.java <<'ZEOF'
          package com.zaeem.ja;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Calendar;
          import java.util.HashSet;
          import java.util.Set;

          public class MainActivity extends Activity {

              static final String DEV = "الزعيم JA";
              static final int GOLD = 0xFFD4AF37;

              SharedPreferences sp;
              boolean dark;
              int fs;
              int cat = 0, mode = 0; // mode: 0 قائمة، 1 إعدادات، 2 حول المطور
              int bg, cardC, txt, sub;
              LinearLayout list, tabs;
              HorizontalScrollView tabsScroll;
              TextView gear;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("s", 0);
                  build();
              }

              int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              GradientDrawable shape(int color, int radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radius));
                  return g;
              }

              TextView text(String s, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(null, Typeface.BOLD);
                  return t;
              }

              LinearLayout.LayoutParams margins(int l, int t, int r, int b) {
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(dp(l), dp(t), dp(r), dp(b));
                  return lp;
              }

              void build() {
                  dark = sp.getBoolean("dark", true);
                  fs = sp.getInt("fs", 20);
                  bg = dark ? 0xFF0B0B0B : 0xFFFAF6EA;
                  cardC = dark ? 0xFF1A1A1A : 0xFFFFFFFF;
                  txt = dark ? 0xFFF2E6C0 : 0xFF222222;
                  sub = dark ? 0xFF9A9072 : 0xFF777777;
                  getWindow().setStatusBarColor(0xFF000000);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(bg);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  LinearLayout h = new LinearLayout(this);
                  h.setOrientation(LinearLayout.HORIZONTAL);
                  h.setGravity(Gravity.CENTER_VERTICAL);
                  h.setBackgroundColor(0xFF000000);
                  h.setPadding(dp(14), dp(10), dp(14), dp(10));
                  ImageView lg = new ImageView(this);
                  lg.setImageResource(R.drawable.logo);
                  h.addView(lg, new LinearLayout.LayoutParams(dp(44), dp(44)));
                  TextView t = text("عبارات وخواطر", 20, GOLD, true);
                  t.setPadding(dp(12), 0, dp(12), 0);
                  h.addView(t, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                  gear = text("الإعدادات", 14, GOLD, true);
                  gear.setBackground(shape(0xFF1A1A1A, 20));
                  gear.setPadding(dp(14), dp(7), dp(14), dp(7));
                  gear.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          mode = (mode == 0) ? 1 : 0;
                          render();
                      }
                  });
                  h.addView(gear);
                  root.addView(h);

                  View line = new View(this);
                  line.setBackgroundColor(GOLD);
                  root.addView(line, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(2)));

                  tabsScroll = new HorizontalScrollView(this);
                  tabsScroll.setHorizontalScrollBarEnabled(false);
                  tabs = new LinearLayout(this);
                  tabs.setOrientation(LinearLayout.HORIZONTAL);
                  tabs.setPadding(dp(8), dp(10), dp(8), dp(6));
                  tabsScroll.addView(tabs);
                  root.addView(tabsScroll);

                  ScrollView sv = new ScrollView(this);
                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  list.setPadding(0, dp(4), 0, dp(20));
                  sv.addView(list);
                  root.addView(sv, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1));

                  setContentView(root);
                  render();
              }

              void render() {
                  list.removeAllViews();
                  gear.setText(mode == 0 ? "الإعدادات" : "الرئيسية");
                  tabsScroll.setVisibility(mode == 0 ? View.VISIBLE : View.GONE);
                  if (mode == 1) { settings(); return; }
                  if (mode == 2) { about(); return; }

                  tabs.removeAllViews();
                  String[] names = {"الأذكار", "الأدعية", "الحكم", "الخواطر", "المفضلة"};
                  for (int i = 0; i < names.length; i++) {
                      final int k = i;
                      TextView c = text(names[i], 16, i == cat ? 0xFF000000 : GOLD, true);
                      c.setBackground(shape(i == cat ? GOLD : cardC, 20));
                      c.setPadding(dp(18), dp(8), dp(18), dp(8));
                      c.setOnClickListener(new View.OnClickListener() {
                          public void onClick(View v) {
                              cat = k;
                              render();
                          }
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(dp(4), 0, dp(4), 0);
                      tabs.addView(c, lp);
                  }

                  if (cat == 0) daily();
                  if (cat < 4) {
                      for (int i = 0; i < Data.ITEMS[cat].length; i++) list.addView(card(cat, i));
                  } else {
                      favs();
                  }
              }

              void daily() {
                  int d = Calendar.getInstance().get(Calendar.DAY_OF_YEAR);
                  int c = d % 4;
                  int i = d % Data.ITEMS[c].length;
                  LinearLayout b = new LinearLayout(this);
                  b.setOrientation(LinearLayout.VERTICAL);
                  b.setBackground(shape(GOLD, 18));
                  b.setPadding(dp(18), dp(14), dp(18), dp(16));
                  b.addView(text("عبارة اليوم", 14, 0xFF000000, true));
                  TextView m = text(Data.ITEMS[c][i], fs, 0xFF000000, true);
                  m.setLineSpacing(0, 1.3f);
                  m.setPadding(0, dp(8), 0, 0);
                  b.addView(m);
                  list.addView(b, margins(12, 8, 12, 6));
              }

              Set<String> favSet() {
                  return new HashSet<String>(sp.getStringSet("fav", new HashSet<String>()));
              }

              void favs() {
                  Set<String> f = favSet();
                  boolean any = false;
                  for (int c = 0; c < 4; c++) {
                      for (int i = 0; i < Data.ITEMS[c].length; i++) {
                          if (f.contains(c + ":" + i)) {
                              list.addView(card(c, i));
                              any = true;
                          }
                      }
                  }
                  if (!any) {
                      TextView e = text("لم تحفظ أي عبارة بعد.\nاضغط «حفظ» أسفل أي عبارة لتجدها هنا.", 16, sub, false);
                      e.setGravity(Gravity.CENTER);
                      e.setLineSpacing(0, 1.3f);
                      e.setPadding(dp(24), dp(48), dp(24), 0);
                      list.addView(e);
                  }
              }

              TextView btn(String s) {
                  TextView t = text(s, 14, GOLD, true);
                  t.setPadding(dp(14), dp(8), dp(14), dp(8));
                  return t;
              }

              View card(int c, int i) {
                  final String id = c + ":" + i;
                  final String s = Data.ITEMS[c][i];
                  LinearLayout k = new LinearLayout(this);
                  k.setOrientation(LinearLayout.VERTICAL);
                  k.setBackground(shape(cardC, 16));
                  k.setPadding(dp(16), dp(14), dp(16), dp(6));
                  TextView m = text(s, fs, txt, false);
                  m.setLineSpacing(0, 1.35f);
                  k.addView(m);

                  LinearLayout a = new LinearLayout(this);
                  a.setOrientation(LinearLayout.HORIZONTAL);
                  a.setPadding(0, dp(8), 0, 0);

                  TextView cp = btn("نسخ");
                  cp.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("text", s));
                          Toast.makeText(MainActivity.this, "تم النسخ", Toast.LENGTH_SHORT).show();
                      }
                  });
                  TextView sh = btn("مشاركة");
                  sh.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          share(s);
                      }
                  });
                  final TextView fv = btn(favSet().contains(id) ? "إزالة" : "حفظ");
                  fv.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          Set<String> f = favSet();
                          if (f.contains(id)) f.remove(id); else f.add(id);
                          sp.edit().putStringSet("fav", f).apply();
                          if (cat == 4) render();
                          else fv.setText(f.contains(id) ? "إزالة" : "حفظ");
                      }
                  });
                  a.addView(cp);
                  a.addView(sh);
                  a.addView(fv);
                  k.addView(a);
                  k.setLayoutParams(margins(12, 6, 12, 6));
                  return k;
              }

              void share(String s) {
                  Intent i = new Intent(Intent.ACTION_SEND);
                  i.setType("text/plain");
                  i.putExtra(Intent.EXTRA_TEXT, s + "\n\n— تطبيق عبارات وخواطر | " + DEV);
                  startActivity(Intent.createChooser(i, "مشاركة"));
              }

              LinearLayout panel() {
                  LinearLayout p = new LinearLayout(this);
                  p.setOrientation(LinearLayout.VERTICAL);
                  p.setBackground(shape(cardC, 16));
                  p.setPadding(dp(18), dp(14), dp(18), dp(14));
                  list.addView(p, margins(12, 6, 12, 6));
                  return p;
              }

              void settings() {
                  TextView ttl = text("الإعدادات", 22, GOLD, true);
                  ttl.setPadding(dp(18), dp(12), dp(18), dp(4));
                  list.addView(ttl);

                  LinearLayout p1 = panel();
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.HORIZONTAL);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  r.addView(text("الوضع الليلي", 17, txt, true),
                          new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                  Switch sw = new Switch(this);
                  sw.setChecked(dark);
                  sw.setOnCheckedChangeListener(new android.widget.CompoundButton.OnCheckedChangeListener() {
                      public void onCheckedChanged(android.widget.CompoundButton b, boolean on) {
                          sp.edit().putBoolean("dark", on).apply();
                          mode = 1;
                          build();
                      }
                  });
                  r.addView(sw);
                  p1.addView(r);

                  LinearLayout p2 = panel();
                  p2.addView(text("حجم الخط", 17, txt, true));
                  final TextView pv = text("سبحان الله وبحمده، سبحان الله العظيم", fs, sub, false);
                  pv.setPadding(0, dp(10), 0, dp(6));
                  p2.addView(pv);
                  SeekBar sb = new SeekBar(this);
                  sb.setMax(18);
                  sb.setProgress(fs - 14);
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) {
                          fs = 14 + p;
                          pv.setTextSize(fs);
                          sp.edit().putInt("fs", fs).apply();
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });
                  p2.addView(sb);

                  LinearLayout p3 = panel();
                  TextView shareApp = text("مشاركة التطبيق", 17, txt, true);
                  shareApp.setPadding(0, dp(6), 0, dp(14));
                  shareApp.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          Intent i = new Intent(Intent.ACTION_SEND);
                          i.setType("text/plain");
                          i.putExtra(Intent.EXTRA_TEXT, "جرّب تطبيق «عبارات وخواطر» أذكار وأدعية وحكم وخواطر دينية — من تطوير " + DEV);
                          startActivity(Intent.createChooser(i, "مشاركة التطبيق"));
                      }
                  });
                  p3.addView(shareApp);
                  TextView ab = text("حول المطور", 17, txt, true);
                  ab.setPadding(0, dp(6), 0, dp(6));
                  ab.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          mode = 2;
                          render();
                      }
                  });
                  p3.addView(ab);
              }

              void about() {
                  LinearLayout p = panel();
                  p.setGravity(Gravity.CENTER_HORIZONTAL);
                  p.setPadding(dp(18), dp(28), dp(18), dp(28));
                  ImageView lg = new ImageView(this);
                  lg.setImageResource(R.drawable.logo);
                  p.addView(lg, new LinearLayout.LayoutParams(dp(150), dp(150)));
                  TextView n = text(DEV, 28, GOLD, true);
                  n.setGravity(Gravity.CENTER);
                  n.setPadding(0, dp(14), 0, dp(2));
                  p.addView(n);
                  TextView r = text("مطوّر التطبيق", 15, sub, false);
                  r.setGravity(Gravity.CENTER);
                  p.addView(r);
                  TextView d = text("تطبيق خفيف يجمع الأذكار والأدعية والحكم والخواطر الدينية، صُنع ليكون رفيقك كل يوم. لا تنسونا من صالح دعائكم.", 16, txt, false);
                  d.setGravity(Gravity.CENTER);
                  d.setLineSpacing(0, 1.35f);
                  d.setPadding(0, dp(18), 0, dp(14));
                  p.addView(d);
                  TextView v = text("الإصدار 1.0", 14, sub, false);
                  v.setGravity(Gravity.CENTER);
                  p.addView(v);
              }

              @Override
              public void onBackPressed() {
                  if (mode == 2) { mode = 1; render(); }
                  else if (mode == 1) { mode = 0; render(); }
                  else super.onBackPressed();
              }
          }
          ZEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">عبارات وخواطر</string>
          </resources>
          ZEOF
          mkdir -p .
          cat > build.gradle <<'ZEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          ZEOF
          mkdir -p .
          cat > gradle.properties <<'ZEOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          ZEOF
          mkdir -p .
          cat > settings.gradle <<'ZEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'ZaeemJA'
          include ':app'
          ZEOF
          echo '' | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/drawable-nodpi/logo.png
      - name: Debug keystore
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZaeemJA-APK
          path: app/build/outputs/apk/release/*.apk
